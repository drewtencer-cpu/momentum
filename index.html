<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1e9"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Momentum V1.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#191919;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:620px;margin:auto;padding:22px 16px 90px}.top{display:flex;justify-content:space-between}.ey{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}.score{font-size:56px;font-weight:800}.sub,.meta,.note{font-size:12px;opacity:.58}.card{background:#fffdf8;border:1px solid #ddd7ca;border-radius:20px;padding:16px;margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{font-size:18px;margin:0}button{border:0;border-radius:12px;padding:11px 13px;background:#1d1d1d;color:#fff;font:inherit;font-weight:700}button.alt{background:#ece7db;color:#222}button.bad{background:#f1dddd;color:#7b2222}.task{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-top:1px solid #eee7db;cursor:pointer}.task:first-child{border-top:0}.name{font-weight:750}.pts{font-size:20px;font-weight:800;text-align:right}.neg{color:#9b2c2c}.locked{opacity:.4}.locked .name{text-decoration:line-through}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.45;margin-top:18px}.tabs{display:flex;gap:8px;margin-top:12px}.tabs button{flex:1}.rank{display:grid;grid-template-columns:32px 1fr auto;padding:9px 0;border-top:1px solid #eee7db}.bars{height:150px;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid #aaa;padding-top:15px}.bar{flex:1;background:#222;min-height:2px;border-radius:4px 4px 0 0}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end;justify-content:center}.sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fffdf8;border-radius:24px 24px 0 0;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:700;margin-top:11px}input,select{width:100%;font:inherit;padding:12px;border:1px solid #d5cec0;border-radius:10px;background:white}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}.empty{text-align:center;opacity:.5;padding:20px}.ring{width:86px;height:86px;border-radius:50%;background:conic-gradient(#222 var(--p),#d8d3c7 0);position:relative;display:grid;place-items:center}.ring:after{content:"";position:absolute;width:66px;height:66px;background:#f4f1e9;border-radius:50%}.ring span{z-index:2;font-size:11px;text-align:center}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px}}
</style></head><body><main class="app">
<div class="top"><div><div class="ey">Today's score</div><div id="score" class="score">0.00</div><div id="todayLabel" class="sub"></div></div><div id="ring" class="ring"><span id="clock"></span></div></div>
<div class="card"><div class="head"><h2>Tasks</h2><button id="newBtn">+ Task</button></div><div id="tasks"></div></div>
<div class="card"><div class="head"><h2>Scoreboard</h2></div><div class="tabs"><button class="alt" id="hiBtn">High scores</button><button class="alt" id="histBtn">History</button></div><div id="board"></div></div>
<div class="card"><div class="head"><h2>Day settings</h2></div><label>End of day</label><input id="endDay" type="time"><div class="note" style="margin-top:10px">Momentum V1.3 · scores recalculate from task history.</div></div>
</main><audio id="positiveSound" preload="auto" src="positive-points.m4a"></audio>
<div class="modal" id="taskModal"><div class="sheet"><div class="head"><h2 id="formTitle">Task</h2><button class="alt" id="closeTask">Close</button></div>
<label>Task name</label><input id="name"><div class="grid"><div><label>Points</label><input id="points" type="number" min="1" step="1" inputmode="numeric"></div><div><label>Start date</label><input id="start" type="date"></div></div>
<label>Due date / first due date</label><input id="due" type="date"><label>Type</label><select id="type"><option value="once">One-time</option><option value="recurring-lock">Recurring — once per period</option><option value="recurring-repeat">Recurring — repeatable</option></select>
<div id="freqWrap"><label>Frequency</label><select id="freq"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
<div class="actions"><button id="saveBtn">Save</button><button class="bad" id="deleteBtn">Delete</button></div><div class="actions" id="completeWrap"><button id="completeBtn">Complete task</button></div></div></div>
<div class="modal" id="completeModal"><div class="sheet"><div class="head"><h2>Complete task</h2><button class="alt" id="closeComplete">Close</button></div><div id="completeName" class="sub"></div><label>Completion date</label><input id="completeDate" type="date"><div id="preview" class="note" style="margin-top:12px"></div><div class="actions"><button id="confirmBtn">Confirm completion</button></div></div></div>
<script>
(()=>{"use strict";const KEY="momentum-v1.2";let state=load(),editing=null,view="hi";
const $=s=>document.querySelector(s), ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"), today=()=>ds(new Date()), pd=s=>new Date(s+"T12:00:00"), dd=(a,b)=>Math.round((pd(b)-pd(a))/864e5), rnd=n=>Math.round((n+Number.EPSILON)*100)/100, fmt=n=>(n>0?"+":"")+rnd(n).toFixed(2);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{tasks:[],endDay:"22:00"}}catch(e){return{tasks:[],endDay:"22:00"}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function uid(){return Date.now()+"-"+Math.random().toString(36).slice(2)}function esc(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}
function unit(t){return +t.points/Math.max(1,dd(t.start,t.due)+1)}function onceReward(t,d){if(d<t.start||d>t.due)return 0;return rnd(Math.max(unit(t),+t.points-dd(t.start,d)*unit(t)))}function oncePenalty(t,d){if(d<=t.due)return 0;return rnd(-unit(t)*dd(t.due,d))}
function addMonths(s,n){let d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);let last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ds(d)}
function dueFor(t,i){if(t.freq==="daily"){let d=pd(t.due);d.setDate(d.getDate()+i);return ds(d)}if(t.freq==="weekly"){let d=pd(t.due);d.setDate(d.getDate()+7*i);return ds(d)}return addMonths(t.due,i)}
function periodForDate(t,d){if(d<t.due)return null;let i=0,x=t.due,next;while(i<5000){next=dueFor(t,i+1);if(d<next)return {i,due:x,next:next};i++;x=next}return null}
function completions(t){return t.completions||[]}function firstCompletion(t,p){return completions(t).filter(c=>c.period===p.i).sort((a,b)=>a.date.localeCompare(b.date))[0]||null}
function recurContribution(t,d){let p=periodForDate(t,d);if(!p)return 0, cs=completions(t).filter(c=>c.date===d), earned=cs.reduce((a,c)=>a+(+c.points||+t.points),0), first=firstCompletion(t,p);
 if(earned)return rnd(earned);
 if(first&&d>=first.date)return 0;
 if(d>p.due)return rnd(-(+t.points));
 return 0}
function contribution(t,d){if(t.type!=="once")return recurContribution(t,d);if(d<t.start)return 0;if(t.completionDate&&!t.completed)t.completed=t.completionDate;if(t.completed){if(d===t.completed)return d<=t.due?onceReward(t,d):0;if(d>t.completed)return 0}return d>t.due?oncePenalty(t,d):0}
function score(d){return rnd(state.tasks.reduce((a,t)=>a+contribution(t,d),0))}
function recurLocked(t){if(t.type!=="recurring-lock")return false;let p=periodForDate(t,today());return p&&!!firstCompletion(t,p)}
function currentValue(t){if(t.type!=="once")return +t.points;if(today()>t.due)return oncePenalty(t,today());return onceReward(t,today())}
function renderTasks(){let open=state.tasks.filter(t=>t.type!=="once"||!t.completed), normal=open.filter(t=>t.type==="once"), rec=open.filter(t=>t.type!=="once");
 const row=t=>{let v=currentValue(t),lock=recurLocked(t),m=t.type==="once"?(today()>t.due?dd(t.due,today())+" day(s) overdue":"Due "+t.due):(t.freq+" · "+(t.type==="recurring-lock"?"once per period":"repeatable"));return `<div class="task ${lock?"locked":""}" data-id="${t.id}"><div><div class="name">${esc(t.name)}</div><div class="meta">${m} · tap to edit</div></div><div class="pts ${v<0?"neg":""}">${fmt(v)}</div></div>`};
 let h=normal.length?normal.map(row).join(""):'<div class="empty">No current tasks.</div>';if(rec.length)h+='<div class="tag">Recurring</div>'+rec.map(row).join("");$("#tasks").innerHTML=h}
function dates(){let s=new Set([today()]);state.tasks.forEach(t=>{let st=pd(t.start),en=pd(t.completed||today());while(st<=en){s.add(ds(st));st.setDate(st.getDate()+1)}completions(t).forEach(c=>s.add(c.date))});return [...s].sort()}
function renderBoard(){let a=dates().map(d=>[d,score(d)]);if(view==="hi"){a.sort((x,y)=>y[1]-x[1]||y[0].localeCompare(x[0]));$("#board").innerHTML=a.slice(0,20).map((x,i)=>`<div class="rank"><b>${i+1}</b><span>${x[0]}</span><b class="${x[1]<0?"neg":""}">${fmt(x[1])}</b></div>`).join("")}else{a=a.slice(-14);let mx=Math.max(1,...a.map(x=>Math.abs(x[1])));$("#board").innerHTML='<div class="bars">'+a.map(x=>`<div class="bar" title="${x[0]} ${fmt(x[1])}" style="height:${Math.max(2,Math.abs(x[1])/mx*100)}%"></div>`).join("")+'</div><div class="meta" style="margin-top:8px">Last 14 days</div>'}}
function clock(){let [h,m]=state.endDay.split(":").map(Number),n=new Date(),st=new Date(n),en=new Date(n);st.setHours(0,0,0,0);en.setHours(h,m,0,0);let f=Math.max(0,Math.min(1,(n-st)/(en-st)));$("#ring").style.setProperty("--p",f*360+"deg");let z=Math.max(0,Math.floor((en-n)/6e4));$("#clock").innerHTML=z?Math.floor(z/60)+"h "+z%60+"m<br>left":"Day ended"}
function render(){let s=score(today());$("#score").textContent=fmt(s);$("#score").className="score "+(s<0?"neg":"");$("#todayLabel").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});$("#endDay").value=state.endDay;renderTasks();renderBoard();clock()}
function openForm(t){editing=t?t.id:null;$("#formTitle").textContent=t?"Edit task":"New task";$("#name").value=t?t.name:"";$("#points").value=t?t.points:7;$("#start").value=t?t.start:today();let d=new Date();d.setDate(d.getDate()+6);$("#due").value=t?t.due:ds(d);$("#type").value=t?t.type:"once";$("#freq").value=t&&t.freq?t.freq:"weekly";$("#freqWrap").style.display=$("#type").value==="once"?"none":"block";$("#deleteBtn").style.display=t?"block":"none";$("#completeWrap").style.display=t?"flex":"none";$("#taskModal").style.display="flex"}
const cur=()=>state.tasks.find(t=>t.id===editing);
$("#newBtn").onclick=()=>openForm();$("#closeTask").onclick=()=>$("#taskModal").style.display="none";$("#type").onchange=e=>$("#freqWrap").style.display=e.target.value==="once"?"none":"block";$("#tasks").onclick=e=>{let r=e.target.closest("[data-id]");if(r)openForm(state.tasks.find(t=>t.id===r.dataset.id))};
$("#saveBtn").onclick=()=>{let n=$("#name").value.trim();if(!n)return;let o={name:n,points:Math.max(1,Math.round(+$("#points").value||1)),start:$("#start").value||today(),due:$("#due").value||today(),type:$("#type").value,freq:$("#freq").value},t=cur();if(t)Object.assign(t,o);else state.tasks.push(Object.assign({id:uid(),completions:[]},o));save();$("#taskModal").style.display="none";render()};
$("#deleteBtn").onclick=()=>{state.tasks=state.tasks.filter(t=>t.id!==editing);save();$("#taskModal").style.display="none";render()};
$("#completeBtn").onclick=()=>{let t=cur();$("#completeName").textContent=t.name;$("#completeDate").value=today();$("#completeDate").max=today();preview();$("#completeModal").style.display="flex"};$("#closeComplete").onclick=()=>$("#completeModal").style.display="none";
function preview(){let t=cur(),d=$("#completeDate").value;if(!t||!d)return;if(t.type==="once")$("#preview").textContent=d<=t.due?"Completion adds "+fmt(onceReward(t,d))+" to "+d+".":"Overdue completion adds 0.00 on "+d+" and removes that day's penalty and all later penalties.";else{let p=periodForDate(t,d),first=p&&firstCompletion(t,p);$("#preview").textContent=p?(d<=p.due?"On-time completion adds "+fmt(+t.points)+".":(!first?"Overdue completion adds 0.00 and stops this occurrence's penalties.":"Additional repeatable completion adds "+fmt(+t.points)+".")):"This date is before the first recurring due date."}}
$("#completeDate").onchange=preview;
$("#confirmBtn").onclick=()=>{let t=cur(),d=$("#completeDate").value;if(!t||!d)return;if(t.type==="once")t.completed=d;else{let p=periodForDate(t,d);if(!p)return;let first=firstCompletion(t,p);if(t.type==="recurring-lock"&&first)return;let val=(!first&&d>p.due)?0:+t.points;t.completions=t.completions||[];t.completions.push({date:d,period:p.i,points:val})}let earned=t.type==="once"?(d<=t.due?onceReward(t,d):0):((!first&&d>p.due)?0:+t.points);save();$("#completeModal").style.display="none";$("#taskModal").style.display="none";render();if(earned>0){let a=$("#positiveSound");try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}}};
$("#endDay").onchange=e=>{state.endDay=e.target.value;save();clock()};$("#hiBtn").onclick=()=>{view="hi";renderBoard()};$("#histBtn").onclick=()=>{view="hist";renderBoard()};render();setInterval(clock,3e4);if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script></body></html>
